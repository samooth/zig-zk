name: ci

on:
  push:
    branches: [main]
    # The tag is the release, and the only run that can say whether the tag and
    # the manifest describe the same release is one that happens after the tag
    # exists.
    tags: ['v*']
  pull_request:

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: false
          # Full history, and not for speed. The documentation gate's seal rule
          # reads each settled row's cell at the commit that settled it, with
          # `git show`, so a checkout one commit deep reports every seal as
          # pointing at a commit this repository does not have: six failures, the
          # gate red, and no local run able to reproduce it, because a local clone
          # has the history. A gate that only holds on a machine with something
          # extra is not a gate. The shallow default also means the rule had never
          # run in CI at all -- the eighteen commits before this one had never been
          # pushed, so this is the first run that could have caught it.
          fetch-depth: 0
      - name: Setup Zig
        uses: ./.github/actions/setup-zig
        with:
          version: 0.16.0
      - name: Run full suite (incl. STARK e2e + fuzz)
        run: zig build test --summary all
      # Only meaningful once the tag exists, and only cheap: it reads a handful of
      # things out of git. It is skipped on branch pushes rather than made to
      # pass, so a green run on a branch does not claim the release is consistent.
      - name: The tag and the manifest version agree
        if: startsWith(github.ref, 'refs/tags/')
        run: zig build check-release
      # The documentation check is a dependency of `zig build test` above, which
      # is the only place it has ever been wired. The step that used to call a
      # `scripts/check-docs` shell wrapper was removed: that file does not exist,
      # and the step could only ever have failed had the step above passed.
      # Each library ships a build.zig so it can be depended on directly, and
      # nothing else in CI touches those files. A reduced fuzz count is enough
      # here: the point is that the standalone build resolves and runs, and the
      # full 2000 rounds already ran in the step above.
      - name: Build and test each library standalone
        shell: bash
        run: |
          for lib in libs/*/; do
            [ -f "$lib/build.zig" ] || continue
            # Only stark's build defines -Dfuzz-iters; passing it anywhere else
            # is an error, and the full 2000 rounds already ran above.
            opts=""
            [ "$lib" = "libs/stark/" ] && opts="-Dfuzz-iters=50"
            echo "::group::$lib"
            (cd "$lib" && zig build test $opts --summary all)
            echo "::endgroup::"
          done